# Pinned: Cargo.toml's [lints] enumerate this toolchain's lints.
[tools]
"cargo:cargo-llvm-cov" = "0.9.1"
# hk runs the pre-push gate (hk.pkl); `hk install --mise` wires it.
hk = "2.5.0"
rust = "1.94.0"
# engines/transcribe's Python and its lock
uv = "0.13.10"

[tasks.check]
description = "the gate hk's pre-push runs: fmt, clippy, 100 % line coverage"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  { task = "cover" },
]

[tasks.check-engines]
description = "the reference model engines' gate: fmt, lints, each engine's protocol logic at 100 % of lines against a stub model; a model's own test runs only where its weights are"
dir = "{{config_root}}/engines"
# main.rs, models.rs, pocket.rs and moonshine.py hold the model and command-line lines alone,
# exempt, as each model's own test runs only where its weights are
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets --locked -- -D warnings",
  # --show-output: a model test's `skipped: …` line shows where its weights are missing
  "cargo llvm-cov --locked --fail-under-lines 100 --ignore-filename-regex '/(main|models|pocket)\\.rs$' --show-missing-lines -- --show-output",
  "uv run --project transcribe --locked ruff format --check --config transcribe/pyproject.toml transcribe prove.py",
  "uv run --project transcribe --locked ruff check --config transcribe/pyproject.toml transcribe prove.py",
  "uv run --project transcribe --locked pytest transcribe -p no:cacheprovider -rs --cov=transcribe/src --cov-config=transcribe/pyproject.toml",
]

[tasks.cover]
description = "the end-to-end suite under llvm-cov; anything under 100 % of lines fails, naming the lines"
# src/mic.rs and src/speaker.rs alone are exempt: their lines open a real microphone or output,
# which no test may
run = "cargo llvm-cov --fail-under-lines 100 --ignore-filename-regex 'src/(mic|speaker)\\.rs$' --show-missing-lines"

[tasks.dist]
description = "this host's release archive as release.yaml builds it, its next YYYY.M.N stamped, to dist/; signing and publishing stay the workflow's"
run = """
set -euo pipefail
month=$(date -u +%Y.%-m)
version=$month.$(git tag -l "v$month.*" | wc -l | tr -d ' ')
target=$(rustc -vV | sed -n 's/^host: //p')
RIFT_VERSION=$version cargo build --release --locked
mkdir -p dist
tar -czf "dist/rift-$target.tar.gz" -C target/release rift
echo "dist/rift-$target.tar.gz: rift $(target/release/rift version)"
"""

[tasks.install]
description = "a dev build to ~/.local/bin/rift-next, beside the release"
run = "cargo build --release && mkdir -p ~/.local/bin && install -m 755 target/release/rift ~/.local/bin/rift-next"

[tasks.prove-engines]
description = "the reference engines end to end: a throwaway daemon, the fixture, a fake output; needs every model (engines/README.md) and $TRANSCRIBE_MODEL"
# copied out of target/ first: the build cache may sweep it mid-run; PROVE_FAST=1 sends the
# fixture as fast as answered, for a machine under load (engines/prove.py)
run = [
  "cargo build",
  "cargo build --release --manifest-path engines/Cargo.toml",
  "mkdir -p /tmp/rift-prove/bin && cp target/debug/rift engines/target/release/endpoint engines/target/release/read-aloud /tmp/rift-prove/bin/",
  "uv run --project engines/transcribe --locked python engines/prove.py /tmp/rift-prove/bin/rift /tmp/rift-prove/bin /tmp/rift-prove ${PROVE_FAST:+--fast}",
]
