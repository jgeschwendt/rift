# rift's reference model engines: programs on rift's socket, never compiled into it
# (docs/index.html#engines). transcribe/ is a Python project of its own.
[workspace]
members = ["endpoint", "link", "read-aloud"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/jgeschwendt/rift"
version = "0.1.0"

# Exact pins: an engine's numbers (a turn's score, a voice's sound) rest on named versions.
[workspace.dependencies]
link = { path = "link" }
# Silero VAD and Smart Turn, through onnxruntime's prebuilt library.
ort = "=2.0.0-rc.13"
# Pocket TTS on xn, its tensor crate, CPU.
ptts = "=0.2.3"
# the sampler Pocket draws its latents with, as ptts itself depends on them
rand = { version = "=0.9.5", default-features = false, features = ["std_rng"] }
rand_distr = "=0.5.1"
# the Whisper log-mel front end Smart Turn reads
rustfft = "=6.4.1"
serde_json = "=1.0.154"
# SIGTERM, SIGINT, SIGHUP into a thread, as rift's own
signal-hook = "=0.4.6"
# Pocket's tokenizer.json
tokenizers = "=0.23.2"
xn = "=0.2.5"

# The groups at warn and the restriction lints that keep engines honest; the float, cast and
# arithmetic restrictions rift's own table holds are off, since signal processing is all three.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_crate_dependencies = "warn"
unused_qualifications = "warn"
unused_results = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
# signal processing counts samples in usize and times in u64 and f32 by design
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
dbg_macro = "warn"
expect_used = "warn"
missing_docs_in_private_items = "warn"
# as rift's own: every `Result`'s error is not yet documented in prose
missing_errors_doc = "allow"
# ort, ptts and tokenizers bring several versions of the same crates, which no pick here unifies
multiple_crate_versions = "allow"
panic = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
strip = true
