# rift's reference model engines: programs on rift's socket, never compiled into it
# (docs/index.html#engines). transcribe/ is a Python project of its own.
[workspace]
members = ["endpoint", "link", "read-aloud"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/jgeschwendt/rift"
version = "0.1.0"

# Exact pins: an engine's numbers (a turn's score, a voice's sound) rest on named versions.
[workspace.dependencies]
link = { path = "link" }
# Silero VAD and Smart Turn, through onnxruntime's prebuilt library.
ort = "=2.0.0-rc.13"
# Pocket TTS on xn, its tensor crate, CPU.
ptts = "=0.2.3"
# the sampler Pocket draws its latents with, as ptts itself depends on them
rand = { version = "=0.9.5", default-features = false, features = ["std_rng"] }
rand_distr = "=0.5.1"
# the Whisper log-mel front end Smart Turn reads
rustfft = "=6.4.1"
serde_json = "=1.0.154"
# SIGTERM, SIGINT, SIGHUP into a thread, as rift's own
signal-hook = "=0.4.6"
# Pocket's tokenizer.json
tokenizers = "=0.23.2"
xn = "=0.2.5"

# rustc's unstable allow-by-default lints are absent: naming one at any level trips
# `unknown_lints` on stable.
[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
deprecated_in_future = "warn"
deprecated_safe_2024 = "warn"
deref_into_dyn_supertrait = "warn"
edition_2024_expr_fragment_specifier = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "warn"
if_let_rescope = "warn"
impl_trait_overcaptures = "warn"
impl_trait_redundant_captures = "warn"
keyword_idents_2018 = "warn"
keyword_idents_2024 = "warn"
let_underscore_drop = "warn"
linker_messages = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
missing_unsafe_on_extern = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2021_incompatible_closure_captures = "warn"
rust_2021_incompatible_or_patterns = "warn"
rust_2021_prefixes_incompatible_syntax = "warn"
rust_2021_prelude_collisions = "warn"
rust_2024_guarded_string_incompatible_syntax = "warn"
rust_2024_incompatible_pat = "warn"
rust_2024_prelude_collisions = "warn"
single_use_lifetimes = "warn"
tail_expr_drop_order = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
# Pair with clippy::redundant_pub_crate: the grove writes `pub` in private modules,
# 215 sites in 10 crates against 29 `pub(crate)` there in 8 (measured 2026-10-28).
unreachable_pub = "allow"
unsafe_attr_outside_unsafe = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
unstable_features = "warn"
unused_crate_dependencies = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
# clippy::restriction is never a group (clippy's own blanket_clippy_restriction_lints fires on
# it): its lints are enumerated one by one below.
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
absolute_paths = "warn"
# std-only binaries: with no `no_std` target, `core` paths buy nothing.
alloc_instead_of_core = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arbitrary_source_item_ordering = "warn"
arithmetic_side_effects = "warn"
# std has no From/TryFrom between floats and integers: sample conversion needs `as`.
as_conversions = "allow"
as_pointer_underscore = "warn"
as_underscore = "warn"
assertions_on_result_states = "warn"
# Byte-order trio: the grove names its order, little 24 sites in 11 crates, big 13 in 3,
# host 0 (measured 2026-10-28); host_endian_bytes stays on.
big_endian_bytes = "allow"
# std has no TryFrom between floats and integers: PCM and feature math casts them.
cast_possible_truncation = "allow"
# std has no From from integers to floats: sample counts and times become floats by `as`.
cast_precision_loss = "allow"
# std has no TryFrom from floats to integers: a float index or count is cast.
cast_sign_loss = "allow"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
create_dir = "warn"
dbg_macro = "warn"
decimal_literal_representation = "warn"
default_numeric_fallback = "warn"
default_union_representation = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
doc_include_without_cfg = "warn"
doc_paragraphs_missing_punctuation = "warn"
else_if_without_else = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
exit = "warn"
expect_used = "warn"
field_scoped_visibility_modifiers = "warn"
filetype_is_file = "warn"
# PCM samples and model features are floats: signal processing is float math.
float_arithmetic = "allow"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
host_endian_bytes = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
# Pair with clippy::needless_return: the grove returns implicitly, 12 588 sites in 30
# crates against 0 needless `return`s (measured 2026-10-28).
implicit_return = "allow"
# serde_json's `Value[key]` reads Null on a miss and never panics; the lint counts it as a slice.
indexing_slicing = "allow"
infinite_loop = "warn"
inline_asm_x86_att_syntax = "warn"
inline_asm_x86_intel_syntax = "warn"
integer_division = "warn"
integer_division_remainder_used = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
# Byte-order trio: see big_endian_bytes.
little_endian_bytes = "allow"
lossy_float_literal = "warn"
map_err_ignore = "warn"
map_with_unused_argument_over_ranges = "warn"
mem_forget = "warn"
min_ident_chars = "warn"
missing_assert_message = "warn"
missing_asserts_for_indexing = "warn"
missing_docs_in_private_items = "warn"
# We don't yet document every `Result`'s Err variant in prose.
missing_errors_doc = "allow"
missing_inline_in_public_items = "warn"
missing_trait_methods = "warn"
mixed_read_write_in_expression = "warn"
# Pair with self_named_module_files: the grove lays modules out as `mod.rs`, 18 files in
# 9 crates against 2 self-named in 2 (measured 2026-10-28).
mod_module_files = "allow"
# `session::Session`, `roots::roots`… repeating the module name reads fine here.
module_name_repetitions = "allow"
modulo_arithmetic = "warn"
# cpal's tree holds two jni-sys, syn and thiserror (its Android and ALSA backends among them),
# which no version pick here unifies.
multiple_crate_versions = "allow"
multiple_inherent_impl = "warn"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
non_ascii_literal = "warn"
non_zero_suggestions = "warn"
panic = "warn"
panic_in_result_fn = "warn"
partial_pub_fields = "warn"
pathbuf_init_then_push = "warn"
pattern_type_mismatch = "warn"
pointer_format = "warn"
precedence_bits = "warn"
# The crates are CLI binaries: stderr is their interface.
print_stderr = "allow"
# The crates are CLI binaries: stdout is their interface.
print_stdout = "allow"
pub_use = "warn"
# Pair with pub_without_shorthand: the grove writes `pub(crate)`, 345 sites in 15 crates
# against 0 `pub(in crate)` (measured 2026-10-28).
pub_with_shorthand = "allow"
pub_without_shorthand = "warn"
# Pair with clippy::question_mark: the grove propagates with `?`, 3 919 sites in 23 crates
# against 0 hand-written early returns (measured 2026-10-28).
question_mark_used = "allow"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
semicolon_inside_block = "warn"
# Pair with semicolon_inside_block: the grove writes `{ x; }`, 16 sites in 9 crates
# against 4 `{ x };` in 3 (measured 2026-10-28).
semicolon_outside_block = "allow"
separated_literal_suffix = "warn"
shadow_reuse = "warn"
shadow_same = "warn"
shadow_unrelated = "warn"
single_call_fn = "warn"
single_char_lifetime_names = "warn"
# std-only binaries: with no `no_std` target, `alloc` paths buy nothing.
std_instead_of_alloc = "allow"
# std-only binaries: with no `no_std` target, `core` paths buy nothing.
std_instead_of_core = "allow"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "warn"
todo = "warn"
# ≈ eslint `max-lines-per-function: off`; one straight-line `main` beats helpers called once.
too_many_lines = "allow"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
# CLI dispatch handlers keep a uniform `Result` signature even when infallible.
unnecessary_wraps = "allow"
unneeded_field_pattern = "warn"
unreachable = "warn"
# Pair with separated_literal_suffix: the grove writes `1u8`, 243 sites in 17 crates
# against 47 `1_u8` in 7 (measured 2026-10-28).
unseparated_literal_suffix = "allow"
unused_result_ok = "warn"
unused_trait_names = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
use_debug = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"

[profile.release]
strip = true
